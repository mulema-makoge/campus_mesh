name: CampusMesh CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Analyze, Test, and Report
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # SonarCloud needs full git history for blame info
          fetch-depth: 0

      # ── 2. Java (required for Android build tools) ─────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Flutter ─────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      # ── 4. Dependencies ────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── 5. Static analysis ─────────────────────────────────────
      - name: Flutter analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      # ── 6. Unit tests with coverage ────────────────────────────
      - name: Run tests with coverage
        run: flutter test --coverage --coverage-path=coverage/lcov.info

      # ── 7. Upload coverage to Codecov ──────────────────────────
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unittests
          name: campus-mesh-coverage
          fail_ci_if_error: false
          verbose: true

      # ── 8. SonarCloud scan ─────────────────────────────────────
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ── 9. Build debug APK ─────────────────────────────────────
      - name: Build debug APK
        run: flutter build apk --debug

      # ── 10. Upload APK as build artifact ───────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: campus-mesh-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
