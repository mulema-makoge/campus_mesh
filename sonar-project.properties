# SonarCloud project configuration for CampusMesh
# https://sonarcloud.io

sonar.projectKey=mulema-makoge_campus_mesh
sonar.organization=mulema-makoge
sonar.projectName=CampusMesh
sonar.projectVersion=1.0.0

# Source and test directories
sonar.sources=lib
sonar.tests=test

# Language
sonar.language=dart

# Exclusions — generated files and platform code
sonar.exclusions=\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/generated/**,\
  android/**,\
  ios/**,\
  build/**,\
  packages/**

sonar.test.exclusions=\
  test/**

# Coverage report location
# Generated by flutter test --coverage
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality gate
# Fails the CI build if quality gate is not met
sonar.qualitygate.wait=true
